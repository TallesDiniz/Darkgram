<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Darkgram</title>
</head>
<body>
    
    <!-- CONTAINER AREA-->
    <div id="wrapper">
        <div id="container">
            <!-- LEFT AREA-->
            <div class="column left">
                <div class="main">
                    
                </div>
            </div>
            <!-- END LEFT AREA-->

            <!-- RIGHT AREA-->
            <div class="column right">
                <div class="login-panel">
                    <div class="logo">
                        <img class="logo-img" src="./assets/darkgram-logo.png" alt="logo do darkgram">
                    </div>
                    <form>
                        <input placeholder="Telefone, usuário ou email" type="text" name="username">
                        <input placeholder="Senha" type="password" name="password">

                        <input type="submit" value="Entrar">
                    </form>
                </div>
                <div class="infobox">
                    <p>Não possui uma conta? <a href="signup.html">Cadastre-se</a></p>
                </div>

                <div class="get-app-panel">
                    Obtenha o aplicativo
                    <div class="app-buttons">
                         <a href="#">
                            <img src="assets/appstore-logo.jpg" alt="Baixe na AppStore">
                        </a>
                        <a href="#">
                            <img src="assets/playstore-logo.jpg" alt="Baixe na GooglePlay">
                        </a>
                    </div>
                   
                </div>
            </div>
            <!-- END RIGHT AREA-->
        </div>
        <!-- FOOTER -->
        <footer>
            <div class="footer-inner">
                <a href="#">ABOUT US</a>
                <a href="#">SUPPORT</a>
                <a href="#">BLOG</a>
                <a href="#">PRESS</a>
                <a href="#">API</a>
                <a href="#">JOBS</a>
                <a href="#">PRIVACY</a>
                <a href="#">TERMS</a>
                <a href="#">DIRECTORY</a>
                <a href="#">PROFILES</a>
                <a href="#">HASHTAGS</a>
                <a href="#">LANGUAGE</a>
                <div class="text-small">
                    @2025 Darkgram
                </div>
            </div>
        </footer>
    </div>
    <!-- END CONTAINER AREA -->

    
</body>
</html>
